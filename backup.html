<!-- 데이터 백업 및 복원 모달 부분 -->
<div class="modal-overlay" id="backupModal">
<div class="modal-content">
<h3 style="margin-bottom:10px; color:#7b1fa2;">💾 데이터 백업 및 복원</h3>
<p style="font-size:0.82rem; color:#555; line-height:1.4; margin-bottom:12px;">
아래 백업 데이터가 자동으로 입력됩니다. 복사가 안 될 경우 입력란을 길게 눌러 복사하세요.
</p>

<div style="background:#f3e5f5; padding:10px; border-radius:6px; margin-bottom:12px;">
<strong style="font-size:0.9rem; color:#4a148c;">1단계: 백업 데이터 복사 및 사이트 열기</strong>
<textarea id="backupManualCopyArea" aria-label="백업 데이터 복사" placeholder="백업 데이터가 여기에 표시됩니다. 길게 눌러 [전체 선택] 후 [복사]하세요." style="display:block; width:100%; height:110px; margin-top:8px; margin-bottom:8px; font-size:10px; background:#fff; -webkit-user-select:text !important; user-select:text !important; -webkit-touch-callout:default !important; padding:8px; border:1px solid #bcccdc; border-radius:6px;"></textarea>
<button class="btn btn-backup" style="width:100%; margin-bottom:6px;" onclick="copyBackupTextManual()">📋 백업 데이터 복사하기</button>
<button class="btn btn-backup" style="width:100%; background:#4a148c;" onclick="openBackupSiteExternal()">🌐 백업 사이트 열기 (크롬)</button>
<button class="btn btn-restore" style="width:100%; margin-top:8px;" onclick="downloadBackupJsonDirect()">💾 백업 파일 바로 저장하기</button>
</div>

<div style="background:#e8eaf6; padding:10px; border-radius:6px; margin-bottom:12px;">
<strong style="font-size:0.9rem; color:#1a237e;">2단계: 앱 내 백업 파일 복원하기</strong>
<p style="font-size:0.8rem; color:#555; margin:4px 0 6px 0;">저장해 둔 백업 파일(.json)을 선택하면 곧바로 복원됩니다.</p>
<input type="file" id="appRestoreFileInput" accept=".json" onchange="restoreAppFromJsonFile(event)" style="font-size:0.85rem; background:#fff; padding:6px; width:100%; border:1px solid #cbd5e1; border-radius:4px;">
</div>

<div class="btn-group">
<button class="btn btn-danger" onclick="closeBackupModal()">닫기</button>
</div>
</div>
</div>
